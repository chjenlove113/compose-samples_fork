<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #BG_COLOR;
            --text-primary: #TEXT_PRIMARY;
            --text-secondary: #TEXT_SECONDARY;
            --surface: #SURFACE;
            --primary: #PRIMARY;
            --base-font-size: #FONT_SIZEpx;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Roboto', sans-serif, -apple-system;
            font-size: var(--base-font-size);
            line-height: 1.6;
            word-wrap: break-word;
        }

        h1.article-title {
            font-size: 1.6em;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .article-desc {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
            opacity: 0.9;
        }

        hr {
            border: none;
            border-top: 1px solid var(--surface);
            margin: 16px 0;
        }

        img, video {
            max-width: 100% !important;
            height: auto !important;
            display: block;
            margin: 24px auto;
            border-radius: 16px;
            object-fit: cover;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 12px;
            margin: 16px 0;
        }

        p { margin-bottom: 1.2em; }

        a {
            color: var(--primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="content-card">
        <h1 class="article-title">#TITLE</h1>
        <div class="article-meta">
            <span>#AUTHOR</span>
            <span>#DATE</span>
        </div>
        <hr/>
        <div class="article-desc">#DESCRIPTION</div>
        <div class="article-body">
            #CONTENT
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var lazyImages = [].slice.call(document.querySelectorAll("img"));
            if ("IntersectionObserver" in window) {
                let lazyImageObserver = new IntersectionObserver(function(entries, observer) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            let lazyImage = entry.target;
                            if(lazyImage.dataset.src) lazyImage.src = lazyImage.dataset.src;
                            lazyImageObserver.unobserve(lazyImage);
                        }
                    });
                });
                lazyImages.forEach(function(lazyImage) {
                    lazyImageObserver.observe(lazyImage);
                });
            }
        });

        document.addEventListener('click', function(e) {
            var target = e.target.closest('a');
            if (target && target.href) {
                if (target.href.includes('youtube.com') || target.href.includes('youtu.be')) {
                    return; // allow youtube links
                }
                e.preventDefault();
                if (window.AndroidBridge && window.AndroidBridge.onLinkClicked) {
                    window.AndroidBridge.onLinkClicked(target.href);
                }
            }
        }, false);
    </script>
</body>
</html>
